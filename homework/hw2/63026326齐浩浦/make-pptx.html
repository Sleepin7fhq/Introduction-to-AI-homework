<script>
"use strict";
/* ===================== 基础 ===================== */
const CW = 1920, CH = 1080, W = 1280, H = 720, SS = CW / W;
const C = { ink:"#171a21", muted:"#5b6472", line:"#dcd7cc", bg:"#fbfaf6", white:"#ffffff",
            blue:"#1d4ed8", warm:"#b45309", red:"#b91c1c", green:"#047857",
            soft:"#eef2ff", softline:"#c7d2fe", okbg:"#f4fbf8", okline:"#a7d7c5",
            warnbg:"#fff7f7", warnline:"#f0b8b8", faint:"#e8e3d9" };
const FONT = '"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif';

let cv, g;
function begin(){
  cv = document.getElementById("cv");
  cv.width = CW; cv.height = CH;
  g = cv.getContext("2d");
  g.setTransform(SS,0,0,SS,0,0);
  g.textBaseline = "top";
  g.fillStyle = C.bg; g.fillRect(0,0,W,H);
}
const font = (px,bold)=> (bold?"700 ":"400") + px + "px " + FONT;

function wrapText(s, maxW, px, bold){
  g.font = font(px,bold);
  const out = []; let cur = "";
  for (const ch of String(s)){
    if (ch === "\n"){ out.push(cur); cur = ""; continue; }
    const t = cur + ch;
    if (g.measureText(t).width > maxW && cur){ out.push(cur); cur = ch; }
    else cur = t;
  }
  out.push(cur);
  return out;
}
function txt(s, x, y, px, color, bold, maxW, lh){
  maxW = maxW || 1120; lh = lh || px * 1.5;
  const lines = wrapText(s, maxW, px, bold);
  g.fillStyle = color || C.ink; g.font = font(px, !!bold);
  for (let i=0;i<lines.length;i++) g.fillText(lines[i], x, y + i*lh);
  return lines.length * lh;
}
function rrPath(x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function card(x,y,w,h,fill,stroke){
  rrPath(x,y,w,h,14);
  g.fillStyle = fill || C.white; g.fill();
  if (stroke){ g.strokeStyle = stroke; g.lineWidth = 1.2; g.stroke(); }
}
/* 卡片内文：items = [{t,px,bold,color,gap}]，返回高度 */
function cardItems(x,y,w,items,opt){
  opt = opt || {};
  const pad = opt.pad || 16;
  let h = pad*2;
  const measured = items.map(it=>{
    const lh = (it.px||17)*1.55;
    const lines = wrapText(it.t, w-pad*2, it.px||17, it.bold);
    const bh = lines.length*lh + (it.gap||4);
    h += bh;
    return {it, lines, lh, bh};
  });
  h += (opt.extra||0);
  card(x,y,w,h,opt.fill||C.white,opt.stroke||C.line);
  let cy = y + pad;
  for (const m of measured){
    g.fillStyle = m.it.color || C.ink;
    g.font = font(m.it.px||17, !!m.it.bold);
    for (let i=0;i<m.lines.length;i++) g.fillText(m.lines[i], x+pad, cy + i*m.lh);
    cy += m.bh;
  }
  return h;
}
function pill(x,y,w,h,label,fill,stroke,color){
  rrPath(x,y,w,h,h/2);
  g.fillStyle = fill; g.fill();
  if (stroke){ g.strokeStyle = stroke; g.lineWidth = 1.2; g.stroke(); }
  g.fillStyle = color; g.font = font(14,true);
  const tw = g.measureText(label).width;
  g.fillText(label, x + (w-tw)/2, y + (h-16)/2 + 1);
}
function header(kick, title, tpx){
  txt(kick, 72, 40, 13, C.blue, true, 1000);
  const h = txt(title, 70, 64, tpx||38, C.ink, true, 1145, (tpx||38)*1.18);
  return 64 + h + 18;
}
function footer(a,b){
  txt(a, 72, 684, 12, "#8b8477", false, 560);
  g.font = font(12,false);
  const tw = g.measureText(b).width;
  txt(b, 1208 - tw, 684, 12, "#8b8477", false, 400);
}

/* ===================== 图形（坐标系 640×340） ===================== */
const L = (x1,y1,x2,y2,col,w,dash)=>{
  g.save(); g.strokeStyle = col||"#9aa3b2"; g.lineWidth = w||1.5;
  if (dash) g.setLineDash(dash);
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); g.restore();
};
const PL = (pts,col,w)=>{
  g.save(); g.strokeStyle = col; g.lineWidth = w||3.4; g.lineJoin="round"; g.lineCap="round";
  g.beginPath(); pts.forEach((p,i)=> i? g.lineTo(p[0],p[1]) : g.moveTo(p[0],p[1]));
  g.stroke(); g.restore();
};
const DOT = (x,y,r,fill,stroke)=>{
  g.save(); g.beginPath(); g.arc(x,y,r||5,0,Math.PI*2);
  g.fillStyle = fill||C.ink; g.fill();
  if (stroke){ g.strokeStyle = stroke; g.lineWidth = 2.4; g.stroke(); }
  g.restore();
};
const T = (x,y,s,px,col,bold,align)=>{
  g.save(); g.fillStyle = col||C.ink; g.font = font(px||13, !!bold);
  g.textAlign = align || "left";
  g.fillText(s, x, y);
  g.restore();
};
const ARR = (x1,y1,x2,y2,col,w)=>{
  g.save(); g.strokeStyle = col; g.lineWidth = w||2; g.fillStyle = col;
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  const a = Math.atan2(y2-y1, x2-x1), hl = 11;
  g.beginPath();
  g.moveTo(x2,y2);
  g.lineTo(x2 - hl*Math.cos(a-0.42), y2 - hl*Math.sin(a-0.42));
  g.lineTo(x2 - hl*Math.cos(a+0.42), y2 - hl*Math.sin(a+0.42));
  g.closePath(); g.fill(); g.restore();
};

function fig1(){ /* D(x0) 的几何含义 */
  L(90,290,600,290); L(110,40,110,308);
  PL([[150,255],[200,225],[250,196],[300,172],[350,152],[400,137],[460,126],[520,120],[570,117]], C.blue);
  L(250,196,250,290,C.warm,1.3,[6,5]); L(400,137,400,290,C.warm,1.3,[6,5]);
  L(110,196,250,196,C.warm,1.3,[6,5]);
  ARR(250,311,398,311,C.green,2);
  DOT(250,196,5.2,C.ink); DOT(400,137,5.2,C.warm);
  T(190,318,"x₀",14,"#374151"); T(372,318,"x₀+d",14,"#374151");
  T(296,300,"d",13,C.green,true);
  T(116,184,"f(x₀)",12,C.warm); T(408,126,"f(x₀+d) > f(x₀)",12,C.warm);
  T(66,46,"f",12,C.muted); T(585,306,"x",12,C.muted);
}
function fig2(){ /* 第(1)问 */

  L(210,200,345,200,C.green,6);
  L(210,200,210,240,C.green,1.2,[4,4]); L(345,200,345,240,C.green,1.2,[4,4]);
  DOT(210,200,4.8,C.green); DOT(345,200,4.8,C.green); DOT(300,160,4.4,C.ink);
  ARR(210,318,343,318,C.warm,2);
  T(196,248,"−1",13); T(292,248,"0",13); T(334,248,"1/2",13);
  T(352,186,"y = 1/2",12,"#d97706",true);
  T(146,182,"f(−1)=1/2",11.5,C.green);
  T(204,330,"d: 0 → 3/2",12,C.warm,true);
  T(82,52,"f",12,C.muted); T(585,252,"t",12,C.muted);
}
function fig3(){ /* 奇函数 */
  L(80,210,600,210); L(300,45,300,320);
  PL([[102,191],[120,188],[165,178],[210,165],[255,146],[298,121]], C.blue);
  PL([[303,287],[322,286],[345,274],[390,255],[435,242],[480,233],[540,224]], C.warm);
  DOT(300,121,4.4,C.white,C.blue); DOT(300,210,4.8,C.ink); DOT(300,287,4.4,C.white,C.warm);
  T(280,102,"1",12,C.blue); T(308,196,"0",12,C.ink); T(308,292,"−1",12,C.warm);
  T(116,62,"x<0：f = 2^x ↗",13,C.blue,true);
  T(380,280,"x>0：f = −2^−x ↗",13,C.warm,true);
  T(82,52,"f",12,C.muted); T(585,222,"x",12,C.muted);
}
function fig4(){ /* 第(3)(i) 数轴 */
  L(60,230,600,230);
  [[140,178,C.blue],[225,160,C.blue],[390,105,C.green],[520,192,C.red]].forEach(a=>{
    L(a[0],230,a[0],a[1],a[2],3.4); DOT(a[0],230,4.4,a[2]);
  });
  L(140,258,225,258,C.blue,1.8); L(140,252,140,264,C.blue,1.8); L(225,252,225,264,C.blue,1.8);
  T(146,166,"2^t",13,C.blue,true); T(232,148,"2^(t+d)",13,C.blue,true);
  T(348,90,"f(0) ≥ 1",13,C.green,true); T(528,180,"f(d)",13,C.red,true);
  T(126,244,"t",12); T(212,244,"t+d",12); T(382,244,"0",12); T(514,244,"d",12);
  T(158,272,"d ∈ (0, −t)",12,C.blue);
  T(300,300,"(b) 要求它更低 —— 与 (a) 冲突",12,C.red);
}
function fig5(){ /* 引理 1 */
  L(70,250,600,250);
  PL([[110,205],[170,155],[230,112],[272,97],[320,108],[370,165],[420,300]], C.blue);
  DOT(272,97,5.6,C.ink); DOT(420,300,5.6,C.red);

function fig6(){ /* 分支结构 */
  rrPath(30,20,570,72,12); g.fillStyle=C.soft; g.fill(); g.strokeStyle=C.softline; g.lineWidth=1.4; g.stroke();
  T(48,34,"反设：0 < x₁ < x₂，f(x₁) > f(x₂)",12.5,C.blue,true);
  T(48,58,"引理1 ⇒ f(x₂) ≤ 0 ⇒ x₂ 是全局最小点",11.5,"#374151");
  ARR(315,92,315,126,"#94a3b8",2);
  rrPath(30,130,272,88,12); g.fillStyle=C.okbg; g.fill(); g.strokeStyle=C.okline; g.lineWidth=1.4; g.stroke();
  T(46,140,"分支 A：f(x₁) ≤ 0  ✅",12,C.green,true);
  T(46,162,"引理3 ⇒ f(x₂) > f(x₁)",11,"#374151");
  T(46,182,"与假设矛盾，分支关闭",11,"#374151");
  rrPath(330,130,272,88,12); g.fillStyle=C.warnbg; g.fill(); g.strokeStyle=C.warnline; g.lineWidth=1.4; g.stroke();
  T(346,140,"分支 B：f(x₁) > 0  ⚠",12,C.red,true);
  T(346,162,"只得 f(x₂) ≤ 0, x₂ > 1,",11,"#374151");
  T(346,182,"f(t) ≥ M₀ (t ≥ 1)：未闭合",11,"#374151");
  rrPath(30,240,572,66,12); g.fillStyle=C.bg; g.fill(); g.strokeStyle=C.line; g.lineWidth=1.4; g.stroke();
  T(48,252,"A 已闭合 ⇒ 任何下降都必须从正值出发；",11,"#374151");
  T(48,274,"B 若成立，需另证 f 在 1 右侧的“接续”不可能 —— 这正是缺口。",11,"#374151");
}
const FIGS = [fig1,fig2,fig3,fig4,fig5,fig6];

function drawFig(idx, x, y, w){
  const k = w/640;
  g.save(); g.translate(x,y); g.scale(k,k);
  FIGS[idx](g);
  g.restore();
}

/* 简易三列表格 */
function table3(x, y, w, head, rows, colw, opt){
  opt = opt || {};
  const px = opt.px || 15, pad = 10;
  let cy = y;
  g.fillStyle = C.white; rrPath(x,y,w,0,0);
  // 背景
  const heights = rows.map(r=>{
    let hMax = 0;
    r.forEach((cell,i)=>{
      const lines = wrapText(cell, (colw[i]-pad*2), px, false).length;
      hMax = Math.max(hMax, lines*px*1.45);
    });
    return hMax + pad*2;
  });
  const total = heights.reduce((a,b)=>a+b, 0) + 34;
  card(x, y, w, total, C.white, C.line);
  // 表头
  let cx = x + pad;
  g.fillStyle = C.muted; g.font = font(12,true);
  head.forEach((h,i)=>{ g.fillText(h, cx, y+12); cx += colw[i]; });
  L(x+pad, y+32, x+w-pad, y+32, C.faint, 1);
  cy = y + 36;
  rows.forEach((r,ri)=>{
    let cx2 = x + pad;
    r.forEach((cell,i)=>{
      const color = (opt.colorCell && opt.colorCell[ri] && opt.colorCell[ri][i]) || C.ink;
      g.fillStyle = color; g.font = font(px,false);
      const lines = wrapText(cell, colw[i]-pad*2, px, false);
      lines.forEach((ln,k)=> g.fillText(ln, cx2, cy + k*px*1.45));
      cx2 += colw[i];
    });
    cy += heights[ri];
    if (ri < rows.length-1) L(x+pad, cy-6, x+w-pad, cy-6, "#efeae0", 1);
  });
  return total;
}

/* ===================== 10 页内容 ===================== */

  y += 86;

const CRC_T = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }

function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const nameB = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nameB.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameB.length, true); dv.setUint16(28, 0, true);
    lh.set(nameB, 30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + nameB.length);
    const cvv = new DataView(ch.buffer);
    cvv.setUint32(0, 0x02014b50, true);
    cvv.setUint16(4, 20, true); cvv.setUint16(6, 20, true);
    cvv.setUint16(8, 0, true); cvv.setUint16(10, 0, true);
    cvv.setUint16(12, 0, true); cvv.setUint16(14, 0, true);
    cvv.setUint32(16, crc, true); cvv.setUint32(20, data.length, true); cvv.setUint32(24, data.length, true);
    cvv.setUint16(28, nameB.length, true); cvv.setUint16(30, 0, true); cvv.setUint16(32, 0, true);
    cvv.setUint16(34, 0, true); cvv.setUint16(36, 0, true); cvv.setUint32(38, 0, true);
    cvv.setUint32(42, offset, true);
    ch.set(nameB, 46);
    central.push(ch);
    offset += lh.length + data.length;
  }
  const cdSize = central.reduce((a,b)=>a+b.length,0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);

  const all = parts.concat(central, [eocd]);
  const total = all.reduce((a,b)=>a+b.length,0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const a of all){ out.set(a,p); p += a.length; }
  return out;
}

/* 读回 zip 做自检（只支持 store） */
function zipCheck(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let p = bytes.length - 22;
  while (p >= 0 && dv.getUint32(p, true) !== 0x06054b50) p--;
  if (p < 0) throw new Error("EOCD 未找到");
  const n = dv.getUint16(p+10, true);
  let cd = dv.getUint32(p+16, true);
  const names = [];
  for (let i=0;i<n;i++){
    if (dv.getUint32(cd, true) !== 0x02014b50) throw new Error("中央目录签名错误");
    const crc = dv.getUint32(cd+16, true), size = dv.getUint32(cd+24, true);
    const nl = dv.getUint16(cd+28, true), extra = dv.getUint16(cd+30, true), cm = dv.getUint16(cd+32, true);
    const off = dv.getUint32(cd+42, true);
    const name = new TextDecoder().decode(bytes.subarray(cd+46, cd+46+nl));
    const data = bytes.subarray(off+30+nl+extra, off+30+nl+extra+size);
    if (crc32(data) !== crc) throw new Error("CRC 不符：" + name);
    names.push(name);
    cd += 46 + nl + extra + cm;
  }
  return names;
}

'<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>' +
'</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sldLayout>';

function slideXml(n){
  return X + '<p:sld ' + NS + '><p:cSld><p:spTree>' +
  '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>' +
  '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>' +
  '<p:pic><p:nvPicPr><p:cNvPr id="' + (n+10) + '" name="Slide' + n + '"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr>' +
  '<p:blipFill><a:blip r:embed="rId2"/><a:stretch><a:fillRect/></a:stretch></p:blipFill>' +
  '<p:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + SLD_W + '" cy="' + SLD_H + '"/></a:xfrm>' +
  '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>' +
  '</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>';
}

function buildPptx(images){
  const files = [];
  const add = (name, str)=>{ files.push({name, data:new TextEncoder().encode(str)}); };

  add("[Content_Types].xml", X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Default Extension="png" ContentType="image/png"/>' +
    '<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>' +
    '<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>' +
    '<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>' +
    '<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>' +
    images.map((_,i)=>'<Override PartName="/ppt/slides/slide' + (i+1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>').join("") +
    '</Types>');

  add("_rels/.rels", X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/>' +
    '</Relationships>');

  add("ppt/presentation.xml", X + '<p:presentation ' + NS + ' saveSubsetFonts="1">' +
    '<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>' +
    '<p:sldIdLst>' + images.map((_,i)=>'<p:sldId id="' + (256+i) + '" r:id="rId' + (i+2) + '"/>').join("") + '</p:sldIdLst>' +
    '<p:sldSz cx="' + SLD_W + '" cy="' + SLD_H + '" type="screen16x9"/>' +
    '<p:notesSz cx="6858000" cy="9144000"/></p:presentation>');

  add("ppt/_rels/presentation.xml.rels", X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>' +
    images.map((_,i)=>'<Relationship Id="rId' + (i+2) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide' + (i+1) + '.xml"/>').join("") +
    '</Relationships>');

  add("ppt/slideMasters/slideMaster1.xml", MASTER);
  add("ppt/slideMasters/_rels/slideMaster1.xml.rels", X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/>' +
    '</Relationships>');

  add("ppt/slideLayouts/slideLayout1.xml", LAYOUT);
  add("ppt/slideLayouts/_rels/slideLayout1.xml.rels", X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="../slideMasters/slideMaster1.xml"/>' +
    '</Relationships>');

  add("ppt/theme/theme1.xml", THEME);

  images.forEach((img,i)=>{
    add("ppt/slides/slide" + (i+1) + ".xml", slideXml(i+1));
    add("ppt/slides/_rels/slide" + (i+1) + ".xml.rels", X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image' + (i+1) + '.png"/>' +
      '</Relationships>');
    files.push({name:"ppt/media/image" + (i+1) + ".png", data: img});
  });

  return zipStore(files);
}

function dataUrlToBytes(url){
  const b64 = url.slice(url.indexOf(",")+1);
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
function log(html){ const el = document.getElementById("log"); el.innerHTML = html; }
function appendLog(html){ const el = document.getElementById("log"); el.innerHTML += "\n" + html; }

document.getElementById("go").addEventListener("click", async ()=>{
  const btn = document.getElementById("go");
  btn.disabled = true;
  log('<span class="dim">渲染 10 页…</span>');
  try{
    const imgs = [];
    for (let i=0;i<SLIDES.length;i++){
      begin();
      SLIDES[i]();
      const url = cv.toDataURL("image/png");
      imgs.push(dataUrlToBytes(url));
      appendLog('<span class="dim">  第 ' + (i+1) + ' 页渲染完成</span>');
    }
    appendLog('<span class="dim">打包 OOXML…</span>');
    const bytes = buildPptx(imgs);
    const names = zipCheck(bytes);
    appendLog('<span class="ok">ZIP 自检通过：' + names.length + ' 个部件，CRC 全部匹配</span>');
    appendLog('<span class="dim">' + names.slice(0,4).join("  ") + ' …</span>');

    const blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.presentationml.presentation"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "2026新课标I卷-第19题-解析.pptx";
    document.body.appendChild(a); a.click(); a.remove();
    appendLog('<span class="ok">已触发下载：2026新课标I卷-第19题-解析.pptx（' +
      (bytes.length/1024/1024).toFixed(2) + ' MB）</span>');
  }catch(err){
    appendLog('<span class="bad">失败：' + (err && err.message ? err.message : err) + "</span>");
  }finally{
    btn.disabled = false;
  }
});
