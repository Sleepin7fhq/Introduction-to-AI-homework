<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>食量智配｜备餐模拟</title><style>
*{box-sizing:border-box}body{font:16px/1.65 "Microsoft YaHei",sans-serif;color:#23372f;background:#f5f4ee;margin:0}main{max-width:1050px;margin:auto;padding:30px}header{border-bottom:3px solid #36735d;margin-bottom:25px}h1{font-size:32px;margin:0}h2{font-size:21px;margin:24px 0 10px}p{margin:8px 0}table{width:100%;border-collapse:collapse;background:white}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#e8eee7}select,input,button{font:inherit;padding:7px;border:1px solid #a4b5ab;border-radius:4px;background:white}input{width:110px}button{background:#36735d;color:white;cursor:pointer}small{color:#637168}.note{padding:14px;border-left:4px solid #36735d;background:#fff}strong{color:#245744}#scenario{margin:14px 0}footer{margin-top:28px;color:#637168}@media(max-width:600px){main{padding:12px}table{font-size:12px}th,td{padding:5px}}
</style><main><header><small>人工智能+校园食堂 · 离线原型</small><h1>食量智配：备餐决策台</h1><p>数据为168天、3类餐品的模拟需求；以下28天为独立测试期回放，不是实时预测或真实食堂统计。</p></header><h2>测试期整体表现（已计算）</h2><table id="summary"></table><h2>选择一天，查看备餐建议</h2><label>测试日期 <select id="date"></select></label> <button onclick="reveal=!reveal; draw();">显示 / 隐藏实际需求及结果</button><p id="scenario"></p><table id="detail"></table><p><button onclick="draw()">恢复推荐备餐量</button> <button onclick="evaluateManual()">评估手动备餐量</button></p><p id="manual" class="note">可先参考智能建议，修改手动备餐份数后评估；仅为历史模拟回放。</p><footer>成本权重：剩余每份1、缺餐每份2.5（模拟损失单位，非实际人民币）。人工确认后才可执行备餐。</footer></main><script>
const rows=__ROWS__, m=__METRICS__;let reveal=false;const dates=[...new Set(rows.map(r=>r.date))];const select=document.getElementById('date');dates.forEach(d=>select.add(new Option(d,d)));select.onchange=()=>{reveal=false;draw()};const fields=[['MAE（份/条）','mae'],['WAPE（%）','wape'],['累计剩余（份）','leftover'],['累计缺餐（份）','shortage'],['需求满足率（%）','fill'],['模拟损失','cost']];const fmt=(v)=>Number.isInteger(v)?v:v.toFixed(2);document.getElementById('summary').innerHTML='<tr><th>指标</th><th>同星期均值 + 缓冲</th><th>随机森林 + 缓冲</th></tr>'+fields.map(([l,k])=>`<tr><td>${l}</td><td>${fmt(m.baseline[k])}</td><td>${fmt(m.ai[k])}</td></tr>`).join('');function current(){return rows.filter(r=>r.date===select.value)}function draw(){let r=current();document.getElementById('scenario').textContent=`星期${'一二三四五六日'[r[0].weekday]} · 气温 ${r[0].temperature}℃ · ${r[0].rain?'雨天':'非雨天'} · ${r[0].event?'有校园活动':'无校园活动'}`;document.getElementById('detail').innerHTML='<tr><th>餐品</th><th>预订</th><th>AI预测</th><th>传统备餐</th><th>AI备餐</th><th>手动份数</th><th>实际需求</th><th>AI剩余/缺餐</th></tr>'+r.map((x,i)=>`<tr><td>${x.dish}</td><td>${x.preorders}</td><td>${x.ai_pred.toFixed(1)}</td><td>${x.base_prep}</td><td><strong>${x.ai_prep}</strong></td><td><input id="q${i}" type="number" min="0" max="10000" step="1" value="${x.ai_prep}"></td><td>${reveal?x.demand:'—'}</td><td>${reveal?Math.max(x.ai_prep-x.demand,0)+' / '+Math.max(x.demand-x.ai_prep,0):'—'}</td></tr>`).join('');document.getElementById('manual').textContent='可修改手动份数，再评估对应的剩余、缺餐和损失。'}function evaluateManual(){let left=0,short=0;let r=current();for(let i=0;i<r.length;i++){let el=document.getElementById('q'+i),q=Number(el.value);if(el.value===''||!Number.isInteger(q)||q<0||q>10000){document.getElementById('manual').textContent='请输入0—10000之间的整数。';return}left+=Math.max(q-r[i].demand,0);short+=Math.max(r[i].demand-q,0)}document.getElementById('manual').textContent=`手动方案回放：剩余 ${left} 份，缺餐 ${short} 份，模拟损失 ${(left+2.5*short).toFixed(1)}。`;}draw();</script></html>
