[build]
  publish = "public-release/site"

# The repository includes the generated site. Rebuild locally before pushing
# changes to demos or web sources; no host-side Python execution is configured.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
