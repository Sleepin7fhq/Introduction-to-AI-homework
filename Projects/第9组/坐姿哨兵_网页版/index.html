<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>坐姿哨兵 · 网页版</title>
<style>
  :root{
    --navy:#1B3A5B; --orange:#E1662E; --bg:#F7F6F3;
    --ok:#2E8B65; --warn:#C8A23A; --bad:#DC3C3C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);
       font-family:"Microsoft YaHei",system-ui,sans-serif}
  header{padding:18px 26px 10px}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  .sub{color:#6b7683;font-size:13px;margin-top:6px}

  #stage{position:relative;margin:10px 26px 0;max-width:1100px;
         border-radius:14px;overflow:hidden;background:#0e1a26;
         border:6px solid var(--ok);transition:border-color .25s}
  #stage.warn{border-color:var(--warn)}
  #stage.bad{border-color:var(--bad)}
  video{display:block;width:100%;transform:scaleX(-1)}
  canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1)}

  #hud{position:absolute;left:14px;top:12px;display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:rgba(14,26,38,.72);border-radius:999px;padding:6px 13px;
        font-size:13px;color:#dfe8f0}
  .chip b{color:#fff}

  #panel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
         margin:16px 26px;max-width:1100px}
  .card{background:#fff;border:1px solid #e3e0da;border-radius:12px;padding:12px 14px}
  .card .k{font-size:12px;color:#7b8694}
  .card .v{font-size:24px;font-weight:700;margin-top:2px}
  .card .v small{font-size:13px;font-weight:400;color:#7b8694}
  .card.over .v{color:var(--bad)}

  #bar{display:flex;gap:12px;align-items:center;margin:0 26px 26px;max-width:1100px;
       flex-wrap:wrap}
  button{border:0;border-radius:10px;padding:11px 20px;font-size:14px;
         font-family:inherit;cursor:pointer;background:var(--navy);color:#fff}
  button.ghost{background:#fff;color:var(--navy);border:1px solid #d9d5ce}
  button:disabled{opacity:.45;cursor:default}
  #status{font-size:13px;color:#6b7683}

  #gate{position:fixed;inset:0;background:rgba(20,30,42,.94);color:#fff;
        display:flex;align-items:center;justify-content:center;padding:24px;z-index:9}
  #gate .box{max-width:520px;background:#1B3A5B;border-radius:16px;padding:28px 30px}
  #gate h2{margin:0 0 8px;font-size:19px}
  #gate p{font-size:13.5px;line-height:1.8;color:#c8d6e2}
  #gate .hint{background:#25486C;border-radius:10px;padding:12px 14px;font-size:12.5px;
              color:#b9c9d6;margin-top:14px;white-space:pre-wrap}
  #gate button{margin-top:18px}
  .hidden{display:none!important}
</style>
</head>
<body>

<header>
  <h1>坐姿哨兵 · 网页版</h1>
  <div class="sub">四个角度 + 个人基线 · 画面只在本机处理，不上传</div>
</header>

<div id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">
    <div class="chip">今日驼背 <b id="today">0</b> 分钟</div>
    <div class="chip" id="baseChip">正在学习你的坐姿…</div>
  </div>
</div>

<div id="panel">
  <div class="card" id="cCva"><div class="k">颅椎角 CVA</div><div class="v">—<small> °</small></div></div>
  <div class="card" id="cBack"><div class="k">上背角</div><div class="v">—<small> °</small></div></div>
  <div class="card" id="cShift"><div class="k">肩高差</div><div class="v">—<small> %</small></div></div>
  <div class="card" id="cDist"><div class="k">屏幕距离</div><div class="v">—<small> </small></div></div>
</div>

<div id="bar">
  <button id="btnCsv" disabled>导出日志 CSV</button>
  <button id="btnStop" class="ghost" disabled>停止</button>
  <span id="status">未开始</span>
</div>

<div id="gate">
  <div class="box">
    <h2>摄像头使用许可</h2>
    <p>本页面需要使用摄像头，实时分析你的坐姿。<br>
       它只读取耳、肩、髋三个点的位置算角度；画面不上传、不保存，
       日志里只有角度数值与时间。</p>
    <div class="hint" id="gateHint">点「允许」后浏览器会询问一次摄像头权限。</div>
    <button id="btnStart">允许使用并开始</button>
  </div>
</div>

<script type="module">
import { FilesetResolver, PoseLandmarker } from "./vendor/vision_bundle.mjs";

/* ------------------------------------------------------------------
   1. 阈值与指标（与桌面版完全一致）
   ------------------------------------------------------------------ */
const TH = { cva: 50, back: 10, shift: 0.05, dist: 0.30 };

const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const deg = r => r * 180 / Math.PI;

function cva(ear, shoulder) {
  const dx = Math.abs(ear.x - shoulder.x), dy = Math.abs(ear.y - shoulder.y);
  if (dy === 0) return 90;
  return deg(Math.atan2(dy, Math.max(dx, 1e-6)));
}
function backAngle(shoulder, hip) {
  const dx = Math.abs(shoulder.x - hip.x), dy = Math.abs(shoulder.y - hip.y);
  if (dy === 0) return 90;
  return deg(Math.atan2(dx, Math.max(dy, 1e-6)));
}
const shoulderShift = (l, r) => {
  const w = dist2(l, r);
  return w < 1e-6 ? 0 : Math.abs(l.y - r.y) / w;
};
const distRatio = (l, r) => dist2(l, r);

/* ------------------------------------------------------------------
   2. 个性化基线（分位数 + 指数平滑 + 下限）
   ------------------------------------------------------------------ */
class Baseline {
  constructor(o = {}) {
    Object.assign(this, {
      delta: 10, minSamples: 1800, floorDrop: 3,
      window: 3600, updateEvery: 60, alpha: 0.05, q: 0.75
    }, o);
    this.buf = [];
    this.b = null; this.b0 = null; this.samples = 0; this.tick = 0;
  }
  quantile(arr, q) {
    if (!arr.length) return 0;
    const a = [...arr].sort((x, y) => x - y);
    const pos = (a.length - 1) * q;
    const lo = Math.floor(pos), hi = Math.min(lo + 1, a.length - 1);
    return a[lo] * (1 - (pos - lo)) + a[hi] * (pos - lo);
  }
  observe(angle, good) {
    if (!good) return;
    this.buf.push(angle);
    if (this.buf.length > this.window) this.buf.shift();
    this.samples++;
    if (this.samples < this.minSamples) return;
    if (++this.tick < this.updateEvery) return;
    this.tick = 0;
    const qn = this.quantile(this.buf, this.q);
    if (this.b === null) { this.b = qn; this.b0 = qn; }
    else {
      this.b = (1 - this.alpha) * this.b + this.alpha * qn;
      this.b = Math.max(this.b, this.b0 - this.floorDrop);
    }
  }
  threshold(fallback) { return this.b === null ? fallback : this.b - this.delta; }
  get ready() { return this.b !== null; }
  status() {
    return this.ready
      ? `个人基线 ${this.b.toFixed(1)}° · 判定线 ${(this.b - this.delta).toFixed(1)}°`
      : `正在学习你的坐姿（${this.samples}/${this.minSamples} 帧）`;
  }
}

/* ------------------------------------------------------------------
   3. 三层滤波 + 提醒
   ------------------------------------------------------------------ */
const gate = { };
class Filters {
  constructor() { this.durCount = 0; this.active = false; this.slouchSec = 0; this.lastBeep = -1e9; }
  duration(bad, fps) {
    if (bad) this.durCount++; else { this.durCount = 0; this.active = false; }
    const need = Math.max(1, Math.round(3 * fps));
    if (this.durCount >= need && !this.active) { this.active = true; return true; }
    return false;
  }
}

/* ------------------------------------------------------------------
   4. 运行
   ------------------------------------------------------------------ */
const $ = s => document.querySelector(s);
const video = $('#video'), stage = $('#stage'), statusEl = $('#status');
const overlay = $('#overlay'), octx = overlay.getContext('2d');

let landmarker = null, stream = null, running = false;
let baseline = new Baseline(), filt = new Filters();
const rows = [];
let todayBase = loadToday();
let fps = 30;

function todayKey() { return new Date().toISOString().slice(0, 10); }
function loadToday() {
  try { return JSON.parse(localStorage.getItem('pg-' + todayKey())) || { sec: 0 }; }
  catch { return { sec: 0 }; }
}
function saveToday() { localStorage.setItem('pg-' + todayKey(), JSON.stringify(todayBase)); }

async function initModel() {
  const hint = $('#gateHint');
  hint.textContent = '① 正在加载姿态引擎…';
  const vision = await FilesetResolver.forVisionTasks("./vendor/wasm");

  const make = delegate => PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "./models/pose_landmarker_lite.task",
      delegate
    },
    runningMode: "VIDEO",
    numPoses: 1
  });

  hint.textContent = '② 正在初始化模型（约 10–20 秒）…';
  // 先用 CPU：GPU 后端在部分显卡驱动上会“卡住不报错”，这是之前卡死的主因之一。
  // CPU 在 640×480 下足够跑 20 帧以上，稳定性优先。
  try {
    landmarker = await withTimeout(make("CPU"), 45000, 'CPU 模式初始化超时');
  } catch (e) {
    hint.textContent = '② CPU 模式失败，尝试显卡加速…';
    landmarker = await withTimeout(make("GPU"), 45000, 'GPU 模式初始化超时');
  }
}

function withTimeout(promise, ms, msg) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))
  ]);
}

async function start() {
  const hint = $('#gateHint');
  $('#btnStart').disabled = true;

  try {
    if (!landmarker) await initModel();
  } catch (e) {
    hint.textContent = '模型加载失败：' + e.message +
      '\n\n如果是从 file:// 打开的，请改用「启动网页版.bat」。';
    $('#btnStart').disabled = false;
    return;
  }

  hint.textContent = '③ 正在打开摄像头…';
  try {
    // 640×480 足够算角度，而且比 720p 快很多——卡死多半是分辨率太高
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 },
               frameRate: { ideal: 24, max: 30 } },
      audio: false
    });
  } catch (e) {
    hint.textContent =
      '拿不到摄像头：' + e.name + '\n' +
      '· 点地址栏左侧的锁/摄像头图标，把权限设为“允许”\n' +
      '· 关掉正在用摄像头的其他程序（相机、会议软件）\n' +
      '· 一直失败就改用“启动网页版.bat”从 localhost 打开';
    $('#btnStart').disabled = false;
    return;
  }

  video.srcObject = stream;
  try {
    await withTimeout(video.play(), 8000, '视频起播超时');
  } catch (e) {
    hint.textContent = '摄像头打开了但画面起不来：' + e.message;
    $('#btnStart').disabled = false;
    return;
  }

  hint.textContent = '④ 等待第一帧…';
  const ok = await waitFirstFrame(6000);
  if (!ok) {
    hint.textContent = '摄像头打开了，但一直拿不到画面。\n可能被别的程序占用，或设备被系统禁用。';
    $('#btnStart').disabled = false;
    return;
  }

  $('#gate').classList.add('hidden');
  $('#btnStop').disabled = false;
  running = true;
  lastT = performance.now();
  t0 = performance.now();
  statusEl.textContent = '运行中 · 前 1 分钟在学习你的基线';
  loop();
}

function waitFirstFrame(ms) {
  return new Promise(resolve => {
    const t = setInterval(() => {
      if (video.videoWidth > 0) { clearInterval(t); resolve(true); }
    }, 100);
    setTimeout(() => { clearInterval(t); resolve(video.videoWidth > 0); }, ms);
  });
}

let lastVideoTime = -1, lastT = performance.now(), frameCount = 0, t0 = performance.now();
let errShown = false, slowFrames = 0;

function loop() {
  if (!running) return;
  try {
    const now = performance.now();
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const res = landmarker.detectForVideo(video, now);
      handle(res, now);
    }
  } catch (e) {
    // 单帧出错不能把整个循环搞死（以前就是这样卡住的）
    if (!errShown) {
      errShown = true;
      statusEl.textContent = '推理出错，已跳过该帧：' + (e.message || e);
    }
  }
  requestAnimationFrame(loop);
}

function handle(res, now) {
  const W = video.videoWidth, H = video.videoHeight;
  if (!W) return;
  if (overlay.width !== W) { overlay.width = W; overlay.height = H; }
  octx.clearRect(0, 0, W, H);

  const fpsInstant = 1000 / Math.max(1, now - lastT);
  lastT = now;
  fps = fps * 0.95 + Math.min(fpsInstant, 60) * 0.05;
  frameCount++;

  const lms = res.landmarks && res.landmarks[0];
  if (!lms) { setCards(null); return; }

  const P = i => lms[i];
  const ear = P(7), lS = P(11), rS = P(12), hip = P(23);
  const vis = [P(7), P(11), P(12), P(23)].map(p => p.visibility ?? 1);

  // 闸一：关键点可见度
  const minVis = Math.min(...vis);
  const okVis = minVis >= 0.5;
  if (!okVis) { setCards(null); return; }

  const m = {
    cva: cva(ear, lS),
    back: backAngle(lS, hip),
    shift: shoulderShift(lS, rS),
    dist: distRatio(lS, rS)
  };

  const thr = baseline.threshold(TH.cva);
  const bad = (m.cva < thr) || (m.back > TH.back);

  // 闸二：连续 3 秒
  const entered = filt.duration(bad, fps);

  // 学习
  baseline.observe(m.cva, !bad);

  // 闸三：本版只用“在座”近似（画面里有人就当在座）
  if (bad) todayBase.sec += 1 / fps;

  // 提醒（20 秒空调 + 声音）
  if (filt.active) {
    if (filt.slouchSec <= 0) filt.slouchSec = 0;
    filt.slouchSec += 1 / fps;
    if (filt.slouchSec >= 20 && now - filt.lastBeep > 120000) {
      filt.lastBeep = now;
      beep();
    }
  } else {
    filt.slouchSec = 0;
  }

  stage.className = filt.active ? 'bad' : (okVis ? 'ok' : 'warn');
  drawSkeleton(lms, W, H, filt.active);
  setCards(m, thr);
  updateChips();

  if (frameCount % 6 === 0) {
    rows.push([(  (now - t0) / 1000).toFixed(2), m.cva.toFixed(1), m.back.toFixed(1),
               m.shift.toFixed(3), m.dist.toFixed(3), filt.active ? 1 : 0, thr.toFixed(1)]);
  }
}

function drawSkeleton(lms, W, H, bad) {
  const color = bad ? '#DC3C3C' : '#8FD3A8';
  const pairs = [[7, 11], [11, 23], [11, 12], [23, 24]];
  octx.lineWidth = Math.max(3, W / 320);
  octx.strokeStyle = color;
  for (const [a, b] of pairs) {
    octx.beginPath();
    octx.moveTo(lms[a].x * W, lms[a].y * H);
    octx.lineTo(lms[b].x * W, lms[b].y * H);
    octx.stroke();
  }
  for (const i of [7, 11, 12, 23, 24]) {
    octx.beginPath();
    octx.arc(lms[i].x * W, lms[i].y * H, Math.max(4, W / 220), 0, Math.PI * 2);
    octx.fillStyle = '#E1662E';
    octx.fill();
  }
}

function setCards(m, thr) {
  const put = (id, val, unit, over) => {
    const c = $(id);
    c.querySelector('.v').innerHTML = (m ? val : '—') + `<small> ${m ? unit : ''}</small>`;
    c.classList.toggle('over', !!over);
  };
  put('#cCva', m ? m.cva.toFixed(1) : '', '°', m && m.cva < (thr ?? TH.cva));
  put('#cBack', m ? m.back.toFixed(1) : '', '°', m && m.back > TH.back);
  put('#cShift', m ? (m.shift * 100).toFixed(1) : '', '%', m && m.shift > TH.shift);
  put('#cDist', m ? m.dist.toFixed(3) : '', '', m && m.dist > TH.dist);
}

function updateChips() {
  $('#today').textContent = (todayBase.sec / 60).toFixed(0);
  $('#baseChip').textContent = baseline.status();
}

let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 660;
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.35);
  } catch {}
}

/* ------------------------------------------------------------------
   5. 按钮
   ------------------------------------------------------------------ */
$('#btnStart').onclick = start;

$('#btnStop').onclick = () => {
  running = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  $('#btnStop').disabled = true;
  $('#btnCsv').disabled = rows.length === 0;
  statusEl.textContent = '已停止';
  saveToday();
};

$('#btnCsv').onclick = () => {
  const head = 'ts,cva,back,shift,dist,slouching,threshold\n';
  const csv = head + rows.map(r => r.join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'posture_' + todayKey() + '.csv';
  a.click();
};

// 每分钟落一次“今日驼背”，防止刷新丢失
setInterval(() => { if (running) saveToday(); }, 60000);
window.addEventListener('beforeunload', saveToday);
</script>
</body>
</html>
