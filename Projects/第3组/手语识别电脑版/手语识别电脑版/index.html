<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1b2a3a" />
  <title>静态手势识别</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>静态手势识别</h1>
    </div>
    <div class="topbar-right">
      <span id="modelStatus" class="status-pill status-loading">模型加载中…</span>
    </div>
  </header>

  <main class="layout">
    <!-- 左：画面 -->
    <section class="panel stage-panel" aria-label="画面区">
      <div class="video-wrap">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <!-- 视频进度条：文件模式下显示，可拖动、暂停取样 -->
        <input id="seek" type="range" min="0" max="1000" value="0" hidden aria-label="视频进度" />
        <div id="videoPlaceholder" class="video-placeholder">
          <div class="ph-icon">▣</div>
          <p>点击「开启摄像头」或「打开视频」开始</p>
          <p class="ph-sub">画面与关键点仅在本地处理，不会上传</p>
        </div>
      </div>

      <div class="controls">
        <button id="btnStartCam" class="btn btn-primary">开启摄像头</button>
        <button id="btnStopCam" class="btn">关闭摄像头</button>
        <label class="btn btn-file" for="fileVideo">打开视频</label>
        <input id="fileVideo" type="file" accept="video/*" hidden />
      </div>
      <p id="camHint" class="hint" hidden></p>
    </section>

    <!-- 右：结果 + 采样 -->
    <section class="right-col">
      <div class="panel result-panel" aria-label="识别结果区">
        <div class="panel-title">识别结果</div>
        <div id="result" class="result result-idle" aria-live="polite">等待样本</div>
        <div class="result-meta">
          <span id="readyBadge" class="mini-badge mini-idle">未就绪</span>
          <span id="handBadge" class="mini-badge">未检测到手</span>
        </div>
        <details class="diag" id="diagBox">
          <summary>诊断信息（便于调参）</summary>
          <div id="diag" class="diag-body">—</div>
        </details>
      </div>

      <div class="panel samples-panel" aria-label="训练样本区">
        <div class="panel-title">训练样本 <span class="sub">每类≥3 个后自动开始识别</span></div>
        <div id="classRows" class="class-rows"></div>

        <div class="sample-io">
          <button id="btnExport" class="btn btn-outline">导出样本</button>
          <label class="btn btn-outline btn-file" for="fileImport">导入样本</label>
          <input id="fileImport" type="file" accept="application/json,.json" hidden />
          <button id="btnReset" class="btn btn-ghost">清空全部</button>
        </div>
        <p class="hint">样本自动保存在本浏览器；导出 JSON 可在另一台设备导入复用。仅保存类别名与关键点坐标。</p>
      </div>

      <details class="panel params-panel" id="paramsBox">
        <summary>识别参数（调参提高正确率）</summary>
        <div class="params-grid">
          <label>近邻数 k
            <input id="paramK" type="number" min="1" max="10" step="1" value="3" />
          </label>
          <label>拒识阈值（越大越宽松）
            <input id="paramReject" type="number" min="0.05" max="2" step="0.01" value="0.45" />
          </label>
          <label>类别区分比（越大越严格）
            <input id="paramMargin" type="number" min="1" max="3" step="0.01" value="1.12" />
          </label>
          <label>稳定帧数（越大越稳但更慢）
            <input id="paramStable" type="number" min="1" max="15" step="1" value="3" />
          </label>
        </div>
        <p class="hint">误识别多 → 调大「类别区分比」或调小「拒识阈值」；经常「未识别」→ 调大「拒识阈值」或调小「类别区分比」。改动即时生效并保存。</p>
        <button id="btnParamReset" class="btn btn-ghost">恢复默认参数</button>
      </details>
    </section>
  </main>

  <footer class="footer">手势识别实验台 · 本地推理 · 无后端</footer>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
