<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1b2a3a" />
  <title>手语骨架序列采集器</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./collector.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>手语骨架序列采集器</h1>
    </div>
    <div class="topbar-right">
      <span id="modelStatus" class="status-pill status-loading">模型加载中…</span>
    </div>
  </header>

  <main class="layout">
    <!-- 左：画面 -->
    <section class="panel stage-panel" aria-label="画面区">
      <div class="video-wrap">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <div id="videoPlaceholder" class="video-placeholder">
          <div class="ph-icon">▣</div>
          <p>点击「开启摄像头」或「打开视频」开始</p>
          <p class="ph-sub">画面与关键点仅在本地处理，不会上传</p>
        </div>
      </div>

      <div class="controls">
        <button id="btnStartCam" class="btn btn-primary">开启摄像头</button>
        <button id="btnStopCam" class="btn">关闭摄像头</button>
        <label class="btn btn-file" for="fileVideo" role="button" tabindex="0">打开视频</label>
        <input id="fileVideo" type="file" accept="video/*" hidden />
      </div>
      <p id="camHint" class="hint" hidden></p>
      <p class="hint file-hint">提示：上传手语视频后会自动循环播放并逐帧识别骨架。</p>

      <!-- 录制区 -->
      <div class="record-bar">
        <button id="btnRecord" class="btn btn-record">● 开始录制</button>
        <span id="recordStatus" class="record-status">未录制</span>
        <span id="recordFrames" class="record-frames">0 帧</span>
      </div>
    </section>

    <!-- 右：采集设置 + 样本 -->
    <section class="right-col">
      <div class="panel result-panel" aria-label="采集设置区">
        <div class="panel-title">采集设置</div>

        <div class="setting-row">
          <label class="setting-label" for="wordSelect">手语词</label>
          <input id="wordSelect" list="wordList" class="setting-input" placeholder="输入或选择手语词" />
          <datalist id="wordList"></datalist>
        </div>

        <div class="setting-row">
          <label class="setting-label" for="signerInput">采集者</label>
          <input id="signerInput" class="setting-input" placeholder="如 Participant_01" />
        </div>

        <div class="setting-row">
          <label class="setting-label" for="seqLenInput">序列帧数</label>
          <input id="seqLenInput" type="number" class="setting-input" value="30" min="5" max="120" />
        </div>

        <div class="setting-hint">按住「开始录制」，完整做完一个手语动作后松开，即保存为该词的一条骨架序列样本。</div>
      </div>

      <div class="panel samples-panel" aria-label="样本区">
        <div class="panel-title">已采集样本 <span class="sub" id="sampleSummary">0 条</span></div>
        <div id="sampleList" class="sample-list">暂无样本</div>

        <div class="sample-io">
          <button id="btnExport" class="btn btn-primary">导出样本</button>
          <label class="btn btn-outline btn-file" for="fileImport">导入样本</label>
          <input id="fileImport" type="file" accept="application/json,.json" hidden />
          <button id="btnReset" class="btn btn-ghost">清空全部</button>
        </div>
        <p class="hint">样本自动保存在本浏览器；导出 JSON 可用于训练。每条含标签、采集者、视角与连续帧序列。</p>
      </div>

      <div class="panel params-panel" aria-label="词表加载区">
        <div class="panel-title">词表</div>
        <div class="setting-row">
          <label class="btn btn-outline btn-file" for="fileVocab">加载 label_map.json</label>
          <input id="fileVocab" type="file" accept="application/json,.json" hidden />
        </div>
        <p class="hint" id="vocabStatus">未加载词表。加载 data/label_map.json 后可在「手语词」下拉选择 200+ 词。</p>
      </div>
    </section>
  </main>

  <footer class="footer">手语骨架序列采集器 · 本地推理 · 无后端</footer>

  <script type="module" src="./collector.mjs"></script>
</body>
</html>
