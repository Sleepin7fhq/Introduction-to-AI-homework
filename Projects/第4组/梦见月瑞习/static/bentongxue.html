<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>梦见月 · 梦见月瑞习</title>
<link rel="icon" href="mizuki-128.png">
<style>
:root{
  --bg:#F6F2FB; --card:#FFFFFF; --ink:#2C2438; --muted:#7B7189;
  --line:#E8E0F2; --green:#6B4FA3; --green-soft:#EFE9F9;
  --amber:#B9803F; --red:#B5486A; --red-soft:#FBECF1;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:16px;line-height:1.7;
  background-image:radial-gradient(circle at 12% 8%, #FBF7FF 0%, transparent 45%),
                   radial-gradient(circle at 88% 92%, #F5EEFB 0%, transparent 45%);
}
.wrap{max-width:920px;margin:0 auto;padding:28px 22px 80px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.logo{
  width:46px;height:46px;border-radius:14px;background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:22px;font-weight:600;flex:none;
  box-shadow:0 6px 16px rgba(107,79,163,.24);
}
.logo-img{background:url("mizuki.jpg") center/cover;color:transparent;overflow:hidden}
.brand h1{margin:0;font-size:20px;letter-spacing:.5px;font-weight:650}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.spacer{flex:1}
.badge{
  font-size:12px;color:var(--muted);border:1px solid var(--line);
  padding:5px 11px;border-radius:999px;background:#fff;white-space:nowrap;
}
.badge b{color:var(--green);font-weight:600}

/* ---------- steps ---------- */
.steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.step{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
  padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);
  transition:.25s;
}
.step i{
  font-style:normal;width:19px;height:19px;border-radius:50%;background:#EFE9FA;
  display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none;
}
.step.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 14px rgba(107,79,163,.22)}
.step.on i{background:rgba(255,255,255,.25);color:#fff}
.step.done{background:var(--green-soft);border-color:#DCD0EF;color:var(--green)}
.step.done i{background:var(--green);color:#fff}

/* ---------- card ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:26px 26px 24px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 12px 32px rgba(76,60,110,.05);
  animation:rise .35s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.h2{font-size:19px;font-weight:650;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}

/* ---------- concept picker ---------- */
.group{margin-bottom:16px}
.group h3{
  font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1.4px;
  margin:0 0 9px;text-transform:uppercase;
}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:9px 17px;border-radius:12px;font-size:15px;cursor:pointer;
  transition:.18s;font-family:inherit;
}
.chip:hover{border-color:var(--green);color:var(--green);transform:translateY(-1px)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 14px rgba(107,79,163,.2)}

/* ---------- explain ---------- */
textarea{
  width:100%;min-height:180px;resize:vertical;border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.75;
  font-family:inherit;color:var(--ink);background:#FAF6FE;outline:none;
  transition:.2s;
}
textarea:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(107,79,163,.07)}
.meta{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta .grow{flex:1}
.btn{
  border:none;border-radius:12px;padding:11px 22px;font-size:15px;cursor:pointer;
  font-family:inherit;font-weight:550;transition:.18s;
}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(107,79,163,.22)}
.btn.primary:hover{background:#573E88;transform:translateY(-1px)}
.btn.primary:disabled{background:#C9C3D4;box-shadow:none;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--ink);border-color:#CFC4E2}

/* ---------- chat ---------- */
#chat{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.msg{display:flex;gap:11px;animation:rise .3s ease both;max-width:92%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{
  width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-size:15px;background:var(--green-soft);color:var(--green);
}
.msg.me .avatar{background:#F0E9F8;color:var(--muted)}
.avatar.ai{background:url("mizuki.jpg") center/cover;color:transparent}
.bubble{
  background:#F9F5FE;border:1px solid var(--line);border-radius:14px;
  padding:12px 16px;font-size:15.5px;line-height:1.7;white-space:pre-wrap;
}
.msg.me .bubble{background:var(--green);border-color:var(--green);color:#fff}
.bubble .tag{
  display:block;font-size:11px;letter-spacing:1px;color:var(--amber);
  margin-bottom:5px;font-weight:600;
}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:#C9BEDC;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes pop{from{transform:scale(.25);opacity:0}to{transform:scale(1);opacity:1}}

.answerbar{display:flex;flex-direction:column;gap:10px}
.answerbar textarea{min-height:72px}
.answer-actions{display:flex;gap:10px;justify-content:flex-end}
.answer-actions .btn{white-space:nowrap}
.qhint{
  font-size:13px;color:var(--muted);background:#F9F5FE;border:1px dashed var(--line);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;
}
.qhint b{color:var(--green)}

/* ---------- diagnosis ---------- */
.result{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start}
@media (max-width:760px){.result{grid-template-columns:1fr}}
.radar-wrap{text-align:center}
.total{font-size:56px;font-weight:700;line-height:1;color:var(--green);letter-spacing:-2px}
.total small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.total-label{font-size:13px;color:var(--muted);margin-top:6px}
.dimrow{
  display:flex;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line);
}
.dimrow:last-child{border-bottom:none}
.dimname{width:60px;flex:none;font-weight:600;font-size:14.5px}
.dimscore{
  width:46px;flex:none;font-weight:700;font-size:16px;
  color:var(--green);text-align:right;
}
.dimscore.low{color:var(--amber)}
.dimev{flex:1;font-size:14px;color:#4A4356;line-height:1.65}
.dimev.bad{color:#5F5470}
.rewrite{
  margin-top:18px;background:var(--green-soft);border-left:3px solid var(--green);
  border-radius:0 12px 12px 0;padding:15px 18px;font-size:14.5px;line-height:1.75;
}
.rewrite b{color:var(--green);display:block;font-size:12px;letter-spacing:1.5px;margin-bottom:6px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}

/* ---------- 设置弹窗 ---------- */
.badge{cursor:pointer;transition:.18s}
.badge:hover{border-color:var(--green);color:var(--green)}
.modal{position:fixed;inset:0;background:rgba(31,29,26,.42);display:flex;
  align-items:center;justify-content:center;z-index:60;padding:20px;backdrop-filter:blur(2px)}
.modal-card{background:#fff;border-radius:18px;padding:26px 28px;width:100%;max-width:520px;
  box-shadow:0 24px 60px rgba(0,0,0,.18);max-height:88vh;overflow:auto}
.modal-card h3{margin:0 0 4px;font-size:18px}
.modal-card label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.modal-card input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 13px;
  font-size:14px;font-family:inherit;outline:none;background:#FAF6FE}
.modal-card input:focus{border-color:var(--green);background:#fff}
.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.presets button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;
  font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--muted)}
.presets button:hover{border-color:var(--green);color:var(--green)}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
.cfg-status{margin:14px 0 0;font-size:13px;line-height:1.6;padding:10px 13px;border-radius:10px;
  background:#F9F5FE;color:var(--muted);white-space:pre-wrap}
.cfg-status.ok{background:var(--green-soft);color:var(--green)}
.cfg-status.bad{background:var(--red-soft);color:var(--red)}
.foot{margin-top:26px;text-align:center;font-size:12px;color:#A99FBA}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo logo-img"></div>
    <div class="brand">
      <h1>梦见月</h1>
      <p>梦见月瑞习 · 你教我，我装傻。</p>
    </div>
    <div class="spacer"></div>
    <a class="badge" href="/" style="text-decoration:none">← 返回首页</a>
    <div class="badge" id="engineBadge">引擎检测中…</div>
  </header>

  <div class="steps" id="steps">
    <div class="step" data-step="1"><i>1</i>选概念</div>
    <div class="step" data-step="2"><i>2</i>讲给它听</div>
    <div class="step" data-step="3"><i>3</i>被追问</div>
    <div class="step" data-step="4"><i>4</i>诊断卡</div>
  </div>

  <!-- ============ 1. 选概念 ============ -->
  <section class="card" id="pane1">
    <h2 class="h2">先挑一个概念，讲给一个什么都不懂的人听</h2>
    <p class="sub">它会先装懂，再追问。你讲得越含糊，它问得越狠。</p>
    <div id="concepts"></div>
    <div class="group" style="margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)">
      <h3>都不在里面？</h3>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <input id="freeInput" placeholder="输入任意概念，比如「熵增原理」「机会成本」"
               style="flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;
                      padding:11px 16px;font-size:15px;font-family:inherit;outline:none;background:#FAF6FE">
        <button class="btn primary" id="freeBtn">开始教它</button>
      </div>
    </div>
  </section>

  <!-- ============ 2. 讲解 ============ -->
  <section class="card hidden" id="pane2">
    <h2 class="h2" id="pane2Title">讲给梦见月听</h2>
    <p class="sub" id="pane2Sub"></p>
    <textarea id="explainBox" placeholder="像对着一个完全没学过的人那样讲，讲三到五分钟……

提示：先给定义，再说它在什么条件下成立，然后说清楚为什么会这样，最后举一个例子。"></textarea>
    <div class="meta">
      <span id="charCount">0 字</span>
      <span id="timer">00:00</span>
      <span class="grow"></span>
      <button class="btn ghost" id="sampleBtn">填一段示例</button>
      <button class="btn primary" id="submitBtn" disabled>开始教它</button>
    </div>
  </section>

  <!-- ============ 3. 对话 ============ -->
  <section class="card hidden" id="pane3">
    <div id="chat"></div>
    <div class="qhint hidden" id="qhint"></div>
    <div class="answerbar" id="answerBar">
      <textarea id="answerBox" placeholder="用一两句话回答它，或者直接说“我讲不清了”"></textarea>
      <div class="answer-actions">
        <button class="btn ghost" id="skipBtn">跳过，我讲不清了</button>
        <button class="btn primary" id="sendBtn">回答（Ctrl+Enter）</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="toCardBtn">直接看诊断卡 →</button>
    </div>
  </section>

  <!-- ============ 4. 诊断卡 ============ -->
  <section class="card hidden" id="pane4">
    <h2 class="h2" id="cardTitle">理解力诊断卡</h2>
    <p class="sub" id="cardSub"></p>
    <div class="result">
      <div class="radar-wrap">
        <div id="radar"></div>
        <div class="total" id="totalScore">—</div>
        <div class="total-label">综合得分</div>
      </div>
      <div>
        <div id="dims"></div>
        <div class="rewrite" id="rewrite"></div>
        <p class="note" id="dimNote"></p>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="againBtn">再教一个</button>
      <button class="btn ghost" id="copyBtn">复制诊断卡</button>
    </div>
  </section>

  <p class="foot">梦见月瑞习 · 我们不给答案，只给问题。</p>
</div>
<div class="modal hidden" id="cfgModal">
  <div class="modal-card">
    <h3>接入大模型</h3>
    <p class="sub" style="margin-bottom:0">填一次就存在本机 <code>demo/config.json</code>，下次启动自动读取。<br>不填也能用——会一直走本地规则引擎。</p>
    <div class="presets">
      <button data-base="https://api.deepseek.com" data-model="deepseek-chat">DeepSeek</button>
      <button data-base="https://api.siliconflow.cn/v1" data-model="Qwen/Qwen2.5-7B-Instruct">硅基流动</button>
      <button data-base="https://dashscope.aliyuncs.com/compatible-mode/v1" data-model="qwen-plus">阿里百炼</button>
      <button data-base="https://open.bigmodel.cn/api/paas/v4" data-model="glm-4-flash">智谱 GLM</button>
    </div>
    <label>API Key</label>
    <input id="cfgKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
    <label>接口地址</label>
    <input id="cfgBase" placeholder="https://api.deepseek.com" spellcheck="false">
    <label>模型名</label>
    <input id="cfgModel" placeholder="deepseek-chat" spellcheck="false">
    <div class="modal-actions">
      <button class="btn ghost" id="cfgClose">取消</button>
      <button class="btn ghost" id="cfgTest">测试连接</button>
      <button class="btn primary" id="cfgSave">保存并启用</button>
    </div>
    <p class="cfg-status" id="cfgStatus">当前：本地规则引擎</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   状态
   ========================================================= */
const S = {
  sid: null,
  concept: null,
  step: 1,
  qIndex: -1,
  totalQ: 3,
  busy: false,
  timerId: null,
  seconds: 0,
  card: null,
  transcript: []
};

const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};

const SAMPLES = {
  rank: "矩阵的秩，就是把矩阵通过初等行变换化成阶梯形之后，非零行的个数。比如一个 3×3 的矩阵，如果秩是 2，说明有一行可以由另外两行线性表示出来，这一行是多余的。",
  neijuan: "内卷就是在总量不变的前提下，大家为了相对排名投入越来越多。比如一个班只有十个保研名额，所有人从每天学八小时变成十二小时，名额还是十个，排名可能一点没变，但所有人都更累了。",
  derivative: "导数是函数在某一点的变化率。比如位移对时间求导就是速度。几何上它就是那一点切线的斜率。",
  pointer: "指针是一个变量，它存的是另一个变量的地址。比如声明 int *p 让它指向 a 之后，p 里存的就是 a 的地址，*p 就是顺着这个地址把 a 的值取出来。",
  generic: "简单说，它就是……嗯，你可以把它理解成一种处理问题的方式。很多时候我们都会用到它，尤其是在需要判断或者计算的时候。它其实挺重要的。"
};

const FALLBACK_SAMPLE = "简单说，它就是……嗯，你可以把它理解成一种处理问题的方式。很多时候我们都会用到它，尤其是在需要判断或者计算的时候。它其实挺重要的。";

/* =========================================================
   基础工具
   ========================================================= */
async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(() => ({ error: "返回内容解析失败" }));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

let toastTimer = null;
function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

function showStep(n) {
  S.step = n;
  for (let i = 1; i <= 4; i++) {
    const node = document.querySelector(`.step[data-step="${i}"]`);
    node.classList.toggle("on", i === n);
    node.classList.toggle("done", i < n);
  }
  for (let i = 1; i <= 4; i++) {
    $("#pane" + i).classList.toggle("hidden", i !== n);
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* =========================================================
   1. 概念列表
   ========================================================= */
async function loadConcepts() {
  try {
    const res = await fetch("/api/concepts");
    const data = await res.json();
    const box = $("#concepts");
    box.innerHTML = "";
    data.groups.forEach((g) => {
      const gEl = el("div", "group");
      gEl.appendChild(el("h3", "", g.subject));
      const chips = el("div", "chips");
      g.items.forEach((it) => {
        const b = el("button", "chip", it.name);
        b.onclick = () => pickConcept(it, b);
        chips.appendChild(b);
      });
      gEl.appendChild(chips);
      box.appendChild(gEl);
    });
  } catch (e) {
    toast("概念列表加载失败：" + e.message);
  }
}

async function startWith(payload, title, sub) {
  try {
    const res = await api("/api/start", payload);
    S.sid = res.sid;
    S.concept = res.concept;
    $("#pane2Title").textContent = "请解释：" + res.concept.name;
    $("#pane2Sub").innerHTML = sub;
    S.qIndex = -1;
    S.transcript = [];
    startTimer();
    showStep(2);
    setTimeout(() => $("#explainBox").focus(), 250);
  } catch (e) {
    toast("创建会话失败：" + e.message);
  }
}

$("#freeBtn").onclick = () => {
  const name = $("#freeInput").value.trim();
  if (!name) { toast("先写一个概念名"); return; }
  startWith({ concept_id: "free", custom_name: name }, name,
    "这个概念不在预设概念包里，梦见月会从你的表述结构里找漏洞。" +
    "<span style='color:#A69BB8'>（提示：定义 → 条件 → 为什么 → 例子）</span>");
};

async function pickConcept(item, btn) {
  document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
  btn.classList.add("on");
  try {
    const res = await api("/api/start", { concept_id: item.id });
    S.sid = res.sid;
    S.concept = res.concept;
    $("#pane2Title").textContent = "请解释：" + res.concept.name;
    $("#pane2Sub").innerHTML =
      "假装你在给一个外行讲。讲完它会先装懂，再追问。<span style='color:#A69BB8'>（提示：定义 → 条件 → 为什么 → 例子）</span>";
    S.qIndex = -1;
    S.transcript = [];
    startTimer();
    showStep(2);
    setTimeout(() => $("#explainBox").focus(), 250);
  } catch (e) {
    toast("创建会话失败：" + e.message);
  }
}

/* =========================================================
   2. 讲解
   ========================================================= */
function startTimer() {
  clearInterval(S.timerId);
  S.seconds = 0;
  $("#timer").textContent = "00:00";
  S.timerId = setInterval(() => {
    S.seconds++;
    const m = String(Math.floor(S.seconds / 60)).padStart(2, "0");
    const s = String(S.seconds % 60).padStart(2, "0");
    $("#timer").textContent = m + ":" + s;
  }, 1000);
}

function updateCount() {
  const n = $("#explainBox").value.trim().length;
  $("#charCount").textContent = n + " 字";
  $("#submitBtn").disabled = n < 20 || S.busy;
}

$("#explainBox").addEventListener("input", updateCount);
$("#explainBox").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); submitExplain(); }
});
$("#sampleBtn").onclick = () => {
  const key = S.concept ? S.concept.id : "";
  $("#explainBox").value = SAMPLES[key] || FALLBACK_SAMPLE;
  updateCount();
  $("#explainBox").focus();
};
$("#submitBtn").onclick = () => submitExplain();

async function submitExplain() {
  const text = $("#explainBox").value.trim();
  if (text.length < 20 || S.busy) return;
  S.busy = true;
  $("#submitBtn").disabled = true;
  clearInterval(S.timerId);
  $("#chat").innerHTML = "";
  showStep(3);
  addMsg("me", text.slice(0, 140) + (text.length > 140 ? "…" : ""));
  const dots = addTyping();

  try {
    const res = await api("/api/explain", { sid: S.sid, text });
    dots.remove();
    const mis = res.messages.find((m) => m.kind === "misread");
    if (mis) {
      addMsg("ai", mis.text, "我懂了吗？");
    }
    res.messages.filter((m) => m.kind === "probe").forEach((m) => addMsg("ai", m.text, "追问"));
    S.qIndex = res.state.q_index;
    S.totalQ = res.state.total_questions;
    updateQHint(res.state.current_question, 1, S.totalQ);
    if (res.engine) $("#engineBadge").innerHTML = "引擎 · <b>" + res.engine + "</b>";
    $("#answerBox").focus();
  } catch (e) {
    dots.remove();
    addMsg("ai", "出错了：" + e.message + "（现场演示请改用本地引擎）");
  } finally {
    S.busy = false;
    $("#submitBtn").disabled = false;
  }
}

/* =========================================================
   3. 对话
   ========================================================= */
function addMsg(who, text, tag) {
  const wrap = el("div", "msg " + (who === "me" ? "me" : ""));
  const av = el("div", "avatar" + (who === "me" ? "" : " ai"));
  if (who === "me") av.textContent = "我";
  wrap.appendChild(av);
  const b = el("div", "bubble");
  if (tag) b.appendChild(el("span", "tag", tag));
  b.appendChild(document.createTextNode(text));
  wrap.appendChild(b);
  $("#chat").appendChild(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return wrap;
}

function addTyping() {
  const wrap = el("div", "msg");
  wrap.appendChild(el("div", "avatar ai"));
  const b = el("div", "bubble");
  b.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  wrap.appendChild(b);
  $("#chat").appendChild(wrap);
  wrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
  return wrap;
}

function updateQHint(q, cur, total) {
  const box = $("#qhint");
  if (!q) { box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  box.innerHTML = "第 <b>" + cur + "</b>/" + total + " 问　<span style='color:#A99FBA'>· 答不上来就点跳过，卡住本身也是信息</span>";
}

$("#answerBox").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); sendAnswer(false); }
});
$("#sendBtn").onclick = () => sendAnswer(false);
$("#skipBtn").onclick = () => sendAnswer(true);
$("#toCardBtn").onclick = () => goDiagnose();

async function sendAnswer(skip) {
  if (S.busy) return;
  const box = $("#answerBox");
  const text = skip ? "我讲不清了" : box.value.trim();
  if (!text) { toast("先写一句回答，或者点“跳过”"); return; }
  S.busy = true;
  box.value = "";
  addMsg("me", text);
  const dots = addTyping();
  try {
    const res = await api("/api/answer", { sid: S.sid, text });
    dots.remove();
    res.messages.forEach((m) => {
      addMsg("ai", m.text, m.kind === "probe" ? "追问" : "");
    });
    if (res.state.done) {
      updateQHint(null);
      setTimeout(() => goDiagnose(), 700);
    } else {
      updateQHint(res.state.current_question, res.state.q_index + 1, S.totalQ);
    }
  } catch (e) {
    dots.remove();
    addMsg("ai", "出错了：" + e.message);
  } finally {
    S.busy = false;
  }
}

/* =========================================================
   4. 诊断卡
   ========================================================= */
async function goDiagnose() {
  if (S.busy) return;
  S.busy = true;
  showStep(4);
  $("#radar").innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  try {
    const res = await api("/api/diagnose", { sid: S.sid });
    S.card = res.card;
    renderCard(res.card);
    if (res.engine) $("#engineBadge").innerHTML = "引擎 · <b>" + res.engine + "</b>";
  } catch (e) {
    toast("诊断失败：" + e.message);
  } finally {
    S.busy = false;
  }
}

function radarSVG(scores) {
  const cx = 160, cy = 152, R = 92;
  const n = scores.length;
  const ang = (i) => -Math.PI / 2 + (2 * Math.PI * i) / n;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];

  let grid = "";
  for (let ring = 1; ring <= 5; ring++) {
    const r = (R * ring) / 5;
    const pts = [];
    for (let i = 0; i < n; i++) pts.push(pt(i, r).map((v) => v.toFixed(1)).join(","));
    grid += `<polygon points="${pts.join(" ")}" fill="none" stroke="#EAE2F5" stroke-width="1"/>`;
  }
  let axes = "", labels = "";
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i, R);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#EAE2F5" stroke-width="1"/>`;
    const [lx, ly] = pt(i, R + 26);
    const anchor = Math.abs(lx - cx) < 8 ? "middle" : (lx > cx ? "start" : "end");
    labels += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}" font-size="13" fill="#7B7189">${scores[i].label}</text>`;
  }
  const pts = scores.map((s, i) => pt(i, (R * s.value) / 5).map((v) => v.toFixed(1)).join(","));
  const dots = scores.map((s, i) => {
    const [x, y] = pt(i, (R * s.value) / 5);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#6B4FA3"/>`;
  }).join("");

  return `<svg viewBox="0 0 320 310" width="100%" style="max-width:320px">
    <g class="radar-g" style="transform-origin:${cx}px ${cy}px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both">
      ${grid}${axes}
      <polygon points="${pts.join(" ")}" fill="rgba(107,79,163,.16)" stroke="#6B4FA3" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
    </g>
    ${labels}
  </svg>`;
}

function renderCard(card) {
  $("#radar").innerHTML = radarSVG(card.scores);
  $("#totalScore").textContent = card.total;

  const dims = $("#dims");
  dims.innerHTML = "";
  card.evidence
    .slice()
    .sort((a, b) => a.score - b.score)
    .forEach((it) => {
      const row = el("div", "dimrow");
      row.appendChild(el("div", "dimname", it.label));
      const sc = el("div", "dimscore" + (it.score < 3 ? " low" : ""), it.score.toFixed(1));
      row.appendChild(sc);
      row.appendChild(el("div", "dimev" + (it.tone === "bad" ? " bad" : ""), it.evidence));
      dims.appendChild(row);
    });

  $("#rewrite").innerHTML = "<b>改写建议</b>" + card.rewrite;
  $("#dimNote").textContent = card.dimension_note || "";
  $("#cardTitle").textContent = "理解力诊断卡 · " + card.concept;
  $("#cardSub").textContent = "四维得分与人工评分口径一致，每条扣分都指向你的原句。";
}

$("#againBtn").onclick = () => {
  S.sid = null;
  S.concept = null;
  S.card = null;
  $("#explainBox").value = "";
  updateCount();
  $("#chat").innerHTML = "";
  updateQHint(null);
  document.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
  showStep(1);
};

$("#copyBtn").onclick = async () => {
  if (!S.card) return;
  const c = S.card;
  const lines = [
    "【梦见月 · 理解力诊断卡】",
    "概念：" + c.concept + "　综合：" + c.total + " 分",
    ...c.evidence.map((e) => `· ${e.label} ${e.score.toFixed(1)}　${e.evidence}`),
    "建议：" + c.rewrite
  ];
  try {
    await navigator.clipboard.writeText(lines.join("\n"));
    toast("诊断卡已复制，可以贴到群里了");
  } catch (e) {
    toast("复制失败，请手动截图");
  }
};

/* =========================================================
   模型设置
   ========================================================= */
function setStatus(text, cls) {
  const el = $("#cfgStatus");
  el.textContent = text;
  el.className = "cfg-status" + (cls ? " " + cls : "");
}

function openCfg() {
  fetch("/api/health").then((r) => r.json()).then((h) => {
    $("#cfgBase").value = h.base || "https://api.deepseek.com";
    $("#cfgModel").value = h.model || "deepseek-chat";
    $("#cfgKey").value = "";
    $("#cfgKey").placeholder = h.key ? ("已保存：" + h.key + "（重新粘贴可覆盖）") : "sk-...";
    setStatus(h.llm ? ("当前：大模型 · " + h.model) : "当前：本地规则引擎（没有 Key）",
              h.llm ? "ok" : "");
  }).catch(() => {});
  $("#cfgModal").classList.remove("hidden");
}

async function saveCfg() {
  const key = $("#cfgKey").value.trim();
  const base = $("#cfgBase").value.trim() || "https://api.deepseek.com";
  const model = $("#cfgModel").value.trim() || "deepseek-chat";
  const res = await api("/api/config", { api_key: key, api_base: base, model });
  $("#engineBadge").innerHTML = "引擎 · <b>" + (res.llm ? "大模型" : "本地规则") + "</b>";
  return res;
}

$("#engineBadge").onclick = openCfg;
$("#cfgClose").onclick = () => $("#cfgModal").classList.add("hidden");
$("#cfgModal").onclick = (e) => { if (e.target.id === "cfgModal") $("#cfgModal").classList.add("hidden"); };
document.querySelectorAll(".presets button").forEach((b) => {
  b.onclick = () => {
    $("#cfgBase").value = b.dataset.base;
    $("#cfgModel").value = b.dataset.model;
    $("#cfgKey").focus();
  };
});

$("#cfgTest").onclick = async () => {
  setStatus("正在测试…");
  try {
    const saved = await saveCfg();
    if (!saved.llm) { setStatus("还没填 Key。", "bad"); return; }
    const r = await api("/api/test-llm", {});
    if (r.ok) {
      setStatus("连接成功 ✓  模型 " + r.model + "，耗时 " + r.latency_ms + " ms\n模型回复：" + r.reply, "ok");
    } else {
      setStatus("连接失败" + (r.status ? "（HTTP " + r.status + "）" : "") + "\n"
                + (r.hint || "") + "\n" + (r.detail || ""), "bad");
    }
  } catch (e) {
    setStatus("测试出错：" + e.message, "bad");
  }
};

$("#cfgSave").onclick = async () => {
  try {
    const r = await saveCfg();
    setStatus(r.llm ? ("已启用大模型 · " + r.engine + "\n现在点右上角关闭，回去讲一个概念试试。")
                    : "已清除 Key，回到本地规则引擎。", r.llm ? "ok" : "");
  } catch (e) {
    setStatus("保存失败：" + e.message, "bad");
  }
};

/* =========================================================
   自动演示（兜底）：打开 ?auto=1 会自己演示一遍
   ========================================================= */
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
async function waitUntil(fn, timeout = 12000) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeout) {
    if (fn()) return true;
    await sleep(120);
  }
  return false;
}

async function runAutoDemo() {
  await sleep(500);
  const chip = [...document.querySelectorAll(".chip")].find((c) => c.textContent.trim() === "矩阵的秩");
  if (!chip) return;
  chip.click();
  await waitUntil(() => !document.getElementById("pane2").classList.contains("hidden"));
  await sleep(700);
  document.getElementById("sampleBtn").click();
  await sleep(900);
  document.getElementById("submitBtn").click();
  await waitUntil(() => document.querySelectorAll("#chat .msg").length >= 3);
  await sleep(1400);
  const answer = (t) => {
    const b = document.getElementById("answerBox");
    b.value = t; b.dispatchEvent(new Event("input"));
    document.getElementById("sendBtn").click();
  };
  answer("因为行变换只是把方程组换一种写法，解集的自由度没变，所以秩不变。");
  await waitUntil(() => document.querySelectorAll("#chat .msg").length >= 5);
  await sleep(1400);
  answer("比如一个三行矩阵，第三行等于前两行之和，那它的秩最多是 2，而不是 3。");
  await waitUntil(() => document.querySelectorAll("#chat .msg").length >= 7);
  await sleep(1200);
  document.getElementById("toCardBtn").click();
  await waitUntil(() => document.querySelector("#radar svg") !== null);
}

/* =========================================================
   启动
   ========================================================= */
(async function init() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("#engineBadge").innerHTML = "引擎 · <b>" + (h.llm ? "大模型" : "本地规则") + "</b>　概念 " + h.concepts + " 个";
  } catch (e) { /* ignore */ }
  loadConcepts();
  updateCount();
  showStep(1);
  if (new URLSearchParams(location.search).get("auto")) {
    setTimeout(runAutoDemo, 900);
  }
})();
</script>
